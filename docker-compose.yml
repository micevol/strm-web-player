services:
  strm-web-player:
    build: .
    image: strm-web-player:latest
    pull_policy: never          # 本项目未发布官方镜像，本地构建使用，故禁止自动拉取
    container_name: strm-web-player
    restart: unless-stopped
    init: true
    network_mode: host          # 和 daquanclaw 一致，直接用宿主网络，由 PORT 决定监听端口
    environment:
      PORT: "14000"             # 宿主访问端口（host 网络下即直接监听宿主 14000）
      TZ: "Asia/Shanghai"
      # 以下为 strm-web-player 特有参数：
      # 首次启动自动创建的管理员账号（格式 用户名:密码），务必备份并改强密码
      SEED_ADMIN: "admin:admin123"
      # 是否允许网页自助注册（true=开，false=关）
      ALLOW_REGISTER: "true"
      # 会话签名密钥，务必改成长随机字符串（Linux: openssl rand -base64 48）
      JWT_SECRET: "please-change-me-to-a-long-random-secret"
      # strm 内允许播放的远程域名白名单，* 表示不限制
      ALLOWED_HOSTS: "*"
    volumes:
      # 你的 STRM 文件目录（这是核心，改成你实际生成 strm 的目录）。
      # 注意：容器内固定为 /data/strm，前端/后端都以它为根。
      - "/opt/1panel/docker/compose/strm-web-player/strm:/data/strm:ro"
      # 持久化数据：账号、播放进度、字幕缓存（容器重建不丢失）
      - "/opt/1panel/docker/compose/strm-web-player/data:/data"
    # 说明：daquanclaw 的 PUID/PGID/UMASK 是它镜像内部提权脚本用的，
    # 本项目容器以 root 运行且不依赖这些变量，写了会被忽略，故省略。
    # 若以上 strm 目录需写入(某些工具会回写 .strm)，去掉 :ro 即可。