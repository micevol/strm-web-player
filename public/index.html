<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRM Web Player</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="bg-fx"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand-mark">▶</div>
      <div class="brand-name"><em>STRM</em> Player</div>
      <div class="topbar-spacer"></div>
      <div class="live-badge"><span class="live-dot"></span><span id="libState">已连接</span></div>
      <div class="user-chip">
        <span class="avatar" id="avatar">···</span>
        <span id="username">···</span>
        <span style="color:var(--text-faint)">|</span>
        <button class="btn btn-ghost" id="logoutBtn" style="padding:4px 8px;">退出</button>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="sidebar-header">
          <span>影视库</span>
          <span class="rev-badge" id="revBadge">rev 0</span>
        </div>
        <div class="tree" id="tree"><div class="empty" style="border:none;">加载中…</div></div>
      </aside>

      <main class="content">
        <section id="browseView">
          <div class="section-title" id="dirTitle">全部影片</div>
          <div class="grid" id="grid"></div>
        </section>

        <section id="playerView" style="display:none;">
          <div class="section-title" id="playerSectionTitle">正在播放</div>
          <div class="player-wrap">
            <div class="player-head">
              <div style="font-size:20px;">🎞️</div>
              <div style="min-width:0;flex:1;">
                <div class="player-title" id="playTitle">—</div>
                <div class="player-sub" id="playPath">—</div>
              </div>
              <div class="player-tools" id="subTools" style="display:none;">
                <input type="file" id="subFile" accept=".srt,.vtt,.ass,.ssa,.smi" hidden />
                <label class="btn btn-ghost" for="subFile" title="上传本地字幕">上传字幕</label>
                <button class="btn btn-ghost" id="subMenuBtn" title="字幕">字幕 ▾</button>
                <div class="sub-menu" id="subMenu"></div>
              </div>
            </div>
            <div id="videoHost">
              <div class="video-placeholder">
                <div class="ph-icon">▶</div>
                <div style="font-size:13px;color:var(--text-dim);">从左侧选择影片开始播放</div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/hls.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
